<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iight</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: #1f2937;
        background: #f9fafb;
      }

      .sign-in {
        max-width: 24rem;
        margin: 15vh auto;
        padding: 0 1rem;
      }

      .admin {
        display: flex;
        min-height: 100vh;
      }

      .admin > nav {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: 14rem;
        padding: 1rem;
        background: #fff;
        border-right: 1px solid #e5e7eb;
      }

      .admin > main {
        flex: 1;
        min-width: 0;
        max-width: 48rem;
        padding: 1rem 2rem;
      }

      .admin header,
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1rem;
      }

      .admin table {
        width: 100%;
        border-collapse: collapse;
      }

      .admin th,
      .admin td {
        padding: 0.5rem;
        text-align: left;
        border-bottom: 1px solid #e5e7eb;
      }

      .actions {
        margin: 1rem 0;
      }

      .media-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr));
        gap: 1rem;
        padding: 0;
        list-style: none;
      }

      .media-grid button {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        width: 100%;
        padding: 0.5rem;
        font: inherit;
        color: inherit;
        text-align: left;
        overflow-wrap: anywhere;
        cursor: pointer;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
      }

      .media-grid img,
      .media-type {
        display: grid;
        place-items: center;
        width: 100%;
        aspect-ratio: 1;
        object-fit: contain;
        font-weight: 600;
        color: #6b7280;
        background: #f3f4f6;
      }

      .media-grid small {
        color: #b45309;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0;
        list-style: none;
      }

      .links li {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        overflow-wrap: anywhere;
      }

      .links img,
      .links .media-type {
        flex: none;
        width: 3rem;
        height: 3rem;
        object-fit: cover;
        font-size: 0.75rem;
      }

      .media-preview {
        display: block;
        max-width: 100%;
        max-height: 50vh;
        margin: 0 auto;
      }

      @media (max-width: 40rem) {
        .admin {
          flex-direction: column;
        }

        .admin > nav {
          width: auto;
          border-right: 0;
          border-bottom: 1px solid #e5e7eb;
        }

        .admin > main {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
