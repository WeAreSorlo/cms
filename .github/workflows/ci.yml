name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # The tests' database, as their default URL names it
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sorlo
          POSTGRES_PASSWORD: sorlo
          POSTGRES_DB: sorlo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorlo -d sorlo_test"
          --health-interval 1s
          --health-retries 30
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v7
        with:
          path: cms
          persist-credentials: false

      # The CMS links Sorlo Forms from ../core until it's on npm. While WeAreSorlo/forms is private, a read-only deploy
      # key reads it. Without the secret, the checkout uses the workflow's own token, which reads it once it's public
      - uses: actions/checkout@v7
        with:
          repository: WeAreSorlo/forms
          path: core
          ssh-key: ${{ secrets.FORMS_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cms/package-lock.json
            core/package-lock.json

      - name: Build Sorlo Forms
        working-directory: core
        run: npm ci && npm run build

      - run: npm ci

      - run: npm run format

      - run: npm run typecheck

      - run: npm run build

      - run: npm test
