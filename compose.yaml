services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sorlo
      POSTGRES_PASSWORD: sorlo
      POSTGRES_DB: sorlo
    ports:
      # Development credentials, so only listen on this machine
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    configs:
      - source: databases
        target: /docker-entrypoint-initdb.d/databases.sql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'sorlo', '-d', 'sorlo']
      interval: 1s
      retries: 30

configs:
  # Runs once, when the volume is first created: the tests' database and the starter's
  databases:
    content: |
      CREATE DATABASE sorlo_test;
      CREATE DATABASE sorlo_starter;

volumes:
  postgres:
